spring:
  application:
    name: InstantCart-backend

  data:
    mongodb:
      uri: ${DB_URL}

    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      connect-timeout: 10s
      timeout: 10s

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${COMPANY_EMAIL}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret:
    key: ${JWT_SECRET}


razorpay:
  key-id: ${RAZORPAY_KEY_ID} #"rzp_test_Td0Wic3t3B5luP"
  key-secret: ${RAZORPAY_KEY_SECRET} #"W8vriNtysoeNTaZbinDt4DYw"

server:
  port: 9091


cloudinary:
  cloud:
    name: ${CLOUD_NAME}
    key: ${CLOUD_KEY}
    secret: ${CLOUD_SECRET}


