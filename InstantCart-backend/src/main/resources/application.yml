spring:
  application:
    name: InstantCart-backend

  data:
    mongodb:
      uri: ${DB_URL}

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${COMPANY_EMAIL}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
#logging:
#  level:
#    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
#    org.springframework.data.mongodb.repository.query: DEBUG
#    org.mongodb.driver.protocol.command: DEBUG

jwt:
  secret:
    key: ${JWT_SECRET}

server:
  port: 9091


cloudinary:
  cloud:
    name: ${CLOUD_NAME}
    key: ${CLOUD_KEY}
    secret: ${CLOUD_SECRET}


